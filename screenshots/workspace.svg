    <text x="310" y="120" fill="#a78bfa" font-size="10" font-family="monospace">import React from 'react';</text>
    <text x="310" y="136" fill="#a78bfa" font-size="10" font-family="monospace">import { Link } from 'react-router-dom';</text>
