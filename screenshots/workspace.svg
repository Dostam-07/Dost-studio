    <text x="310" y="176" fill="#e4e4ed" font-size="10" font-family="monospace">export default function Dashboard() {</text>
    <text x="326" y="196" fill="#a78bfa" font-size="10" font-family="monospace">const [data, setData] =</text>
    <text x="326" y="212" fill="#a78bfa" font-size="10" font-family="monospace">useState‹AnalyticsData[]›([]);</text>
    <text x="310" y="232" fill="#e4e4ed" font-size="10" font-family="monospace"></text>
    <text x="326" y="252" fill="#f59e0b" font-size="10" font-family="monospace">useEffect(() => {</text>
    <text x="342" y="272" fill="#34d399" font-size="10" font-family="monospace">fetch('/api/metrics')</text>
    <text x="358" y="292" fill="#e4e4ed" font-size="10" font-family="monospace">.then(r =› r.json())</text>
    <text x="358" y="312" fill="#e4e4ed" font-size="10" font-family="monospace">.then(setData);</text>
    <text x="326" y="332" fill="#f59e0b" font-size="10" font-family="monospace">}, []);</text>
